{% extends "catalog/base_generic.html" %}

{% block content %}
    <h1>Book List</h1>
    <table class="table table-hover">
        <thead>
            <tr>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
            </tr>
        </thead>
        <tbody>
            {% for book in book_list %}
            <tr>
                <td><a href="{{ book.get_absolute_url }}">{{ book.title }}</a></td>
                <td>{{book.author}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock content %}
